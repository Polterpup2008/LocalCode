<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">LocalCode — Build with local intelligence.</title>
  <desc id="description">An open-source coding agent for your own models and projects. Local GGUF models, real development tools, and your workspace. Windows release candidate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22221f"/>
      <stop offset="1" stop-color="#151513"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d97757"/>
      <stop offset="1" stop-color="#b05030"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#d97757" stop-opacity=".13"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <ellipse cx="990" cy="180" rx="330" ry="170" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="399" rx="19.5" fill="none" stroke="#3c3933"/>
